[package]
name = "garmin-tracker-rs"
version = "1.7.0"
description = "Sync your devices and track your strength training"
authors = ["Emiliopg91 <ojosdeserbio@gmail.com>"]
edition = "2024"
repository = "https://github.com/Emiliopg91/garmin-tracker-rs"
categories = ["Utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "garmin_tracker_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }
serde_yaml = "^0"
phf_codegen = "^0"
syn = { version = "^2", features = ["visit"] }
swc_ecma_ast = "^26"
swc_ecma_parser = "^42"
swc_ecma_visit = "^26"
swc_common = "^24"
walkdir = "^2"

[dependencies]
chrono = "^0"
clap = { version = "^4", features = ["derive"] }
dirs = "^6"
fitparser = "^0"
garmin-tracker-rs-macros = { path = "../src-tauri-macros" }
indexmap = { version = "^2", features = ["serde"] }
mtp-rs = "^0"
nusb = "^0"
phf = { version = "^0", features = ["macros"] }
rusqlite_orm = { path = "../rusqlite_orm/orm" }
#rusqlite_orm = "0.1.0"
rusqlite_orm_macros = { path = "../rusqlite_orm/macros" }
#rusqlite_orm_macros = "0.1.0"
semver = "^1"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
serde_yaml = "^0"
tauri = { version = "^2", features = [] }
tauri-plugin-log = "^2"
tauri-plugin-opener = "^2"
tauri-plugin-single-instance = "^2"
#tauri-rs-ts-ipc = { path = "../../syn-test" }
tauri-rs-ts-ipc = { version = "^0" }
thiserror = "^2"
tokio = { version = "^1", features = ["rt-multi-thread", "macros", "time"] }
tokio-stream = "^0"
ureq = { version = "^3", features = ["json"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "z"

[profile.dev]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = false
lto = false
panic = "abort"
codegen-units = 256
incremental = true
strip = false
